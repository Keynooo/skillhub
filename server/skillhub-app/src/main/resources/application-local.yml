spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  datasource:
    # 用本机 LAN IP（非 loopback）：VS Code Remote-SSH 会把 106 的 postgres 自动转发到 127.0.0.1:5432/5433，
    # 抢占 localhost 连接导致密码认证失败。走 192.168.50.66 命中 docker 的 0.0.0.0 绑定，绕开 loopback 转发。
    url: jdbc:postgresql://192.168.50.66:5433/skillhub
    username: skillhub
    password: skillhub_dev
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${OAUTH2_GITHUB_CLIENT_ID:local-placeholder}
            client-secret: ${OAUTH2_GITHUB_CLIENT_SECRET:local-placeholder}
  mail:
    # dev 用 docker-compose 里的 mailpit（localhost:1025），忘记密码等邮件在 http://localhost:8025 查看
    host: localhost
    port: 1025

skillhub:
  builtin-skills:
    dev-package-base-url: http://127.0.0.1:8080/api/builtin-skills/packages
  publish:
    dev-allowed-hosts:
      - localhost
      - 127.0.0.1
  auth:
    mock:
      enabled: true
  ratelimit:
    download:
      anonymous-cookie-secret: ${SKILLHUB_DOWNLOAD_ANON_COOKIE_SECRET:local-dev-download-secret-32-bytes}
  notification:
    cleanup:
      read-retention-days: 30
      unread-retention-days: 90
  security:
    scanner:
      enabled: ${SKILLHUB_SECURITY_SCANNER_ENABLED:true}
      base-url: ${SKILLHUB_SECURITY_SCANNER_URL:http://localhost:18000}
      mode: ${SKILLHUB_SECURITY_SCANNER_MODE:upload}
    stream:
      reclaim-enabled: ${SKILLHUB_SCAN_STREAM_RECLAIM_ENABLED:true}
      reclaim-min-idle: ${SKILLHUB_SCAN_STREAM_RECLAIM_MIN_IDLE:PT2M}
      reclaim-batch-size: ${SKILLHUB_SCAN_STREAM_RECLAIM_BATCH_SIZE:20}
      reclaim-interval: ${SKILLHUB_SCAN_STREAM_RECLAIM_INTERVAL:PT30S}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
  profile:
    moderation:
      machine-review: ${SKILLHUB_PROFILE_MACHINE_REVIEW_ENABLED:true}
      human-review: ${SKILLHUB_PROFILE_HUMAN_REVIEW_ENABLED:true}

logging:
  level:
    com.iflytek.skillhub: INFO
    org.springframework.security: WARN
